name: CSC Part 1 Android Offline CI

on:
  push:
    branches:
      - feature/standalone-android-offline-exams
    paths:
      - 'apps/android/**'
      - '.github/workflows/csc-part1-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-csc-part-1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx1024m"
    steps:
      - name: Check out CSC offline development branch
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare CI debug signing key
        working-directory: apps/android
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Run CSC Part 1 Android unit tests
        working-directory: apps/android
        run: gradle :app:testCscPart1DebugUnitTest --stacktrace --no-daemon --max-workers=2

      - name: Build CSC Part 1 debug APK
        working-directory: apps/android
        run: gradle :app:assembleCscPart1Debug --stacktrace --no-daemon --max-workers=2

      - name: Verify independent offline APK
        working-directory: apps/android
        run: |
          APK_PATH=$(find app/build/outputs/apk/cscPart1/debug -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK_PATH" > apk-badging.txt
          "$AAPT" dump permissions "$APK_PATH" > apk-permissions.txt
          grep -q "package: name='com.certmaster.cscpart1'" apk-badging.txt
          if grep -Eq "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" apk-permissions.txt; then
            cat apk-permissions.txt
            exit 1
          fi
          gradle :app:dependencies --configuration cscPart1DebugRuntimeClasspath --no-daemon --max-workers=2 > offline-runtime-dependencies.txt
          if grep -Eq 'com.google.firebase:|com.squareup.retrofit2:|com.squareup.okhttp3:|androidx.credentials:|com.google.android.libraries.identity.googleid:' offline-runtime-dependencies.txt; then
            echo "Unexpected cloud dependency in offline runtime"
            exit 1
          fi
          stat --printf='APK bytes: %s\n' "$APK_PATH"
          cat apk-permissions.txt

      - name: Upload executable verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CSC-Part1-Verification-Reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/
            apps/android/apk-badging.txt
            apps/android/apk-permissions.txt
            apps/android/offline-runtime-dependencies.txt
          if-no-files-found: ignore

      - name: Upload CSC Part 1 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CSC-Part1-Offline-Debug-APK
          path: apps/android/app/build/outputs/apk/cscPart1/debug/*.apk
          if-no-files-found: error

      - name: Upload Android test reports when a step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CSC-Part1-Android-Failure-Reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/
          if-no-files-found: ignore
